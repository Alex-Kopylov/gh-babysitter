[project]
name = "gh_babysitter"
version = "1.1.0"
description = "Webhook gateway with fan-out for GitHub orgs: one org-level webhook in, individual filtered SSE subscriptions out"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sse-starlette",
    "typer>=0.27.0",
    "uvicorn",
]

[project.scripts]
gh-babysitter = "gh_babysitter.cli.main:main"

[dependency-groups]
dev = [
  # Linting & formatting
  "ruff",
  "ty",
  "flake8",
  "flake8-pydantic",
  "flake8-async",
  "vulture",
  "deptry>=0.25.1",
  # Testing
  "pytest",
  "pytest-xdist",
  "pytest-timeout",
  "pytest-cov>=7.1.0",
  # Git hooks
  "prek",
  # YAML linting
  "yamllint",
  "pytest-asyncio",
  "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"

[tool.deptry]
known_first_party = ["gh_babysitter"]

[tool.ty.environment]
python-version = "3.14"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 93
